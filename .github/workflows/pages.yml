name: My Day v5 - 更新新聞並發佈 Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions uses UTC. Non-hour boundaries reduce peak-time delays.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-myday
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch Traditional Chinese RTHK RSS
        run: python3 scripts/fetch_news.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static publish directory
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp data/news.json _site/data/news.json

      - name: Upload website and fresh news.json
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to Pages
        id: deployment
        uses: actions/deploy-pages@v4
